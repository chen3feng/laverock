<aside class="sidebar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 12h2M7 7v10M11 4v16M15 7v10M19 11v2" />
      </svg>
    </div>
    <div><b>Laverock</b><span data-i18n="brand.sub">本地语音工作室</span></div>
  </div>
  <nav>
{{nav}}
  </nav>
  <div class="sidebar-foot">
    <select id="langSelect" title="Language" style="background:transparent;color:inherit;border:1px solid var(--line);border-radius:8px;padding:2px 4px;font-size:11px">
      <option value="system" data-i18n="lang.system">跟随系统</option>
      <option value="zh" data-i18n="lang.zh">中文</option>
      <option value="en" data-i18n="lang.en">English</option>
    </select>
    <span id="version"></span><span class="dot" id="connState" data-i18n-title="state.title" title="服务状态"></span>
  </div>
</aside>

<main class="content">
  <div class="wrap">

{{pages}}

  </div>
</main>

<div class="overlay" id="pairOverlay">
  <div class="card">
    <h1 style="font-size:18px;margin:0 0 8px" data-i18n="pair.title">连接到 Laverock</h1>
    <p class="hint" id="pairMsg" data-i18n="pair.msg">在这台电脑上打开「设置 → 手机遥控 → 生成配对二维码」，然后用手机扫码。</p>
    <div style="margin-top:14px">
      <label for="pairCode" data-i18n="pair.code">配对码</label>
      <input type="text" id="pairCode" inputmode="numeric" autocomplete="one-time-code" data-i18n-ph="pair.code.ph" placeholder="6 位数字" />
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="pairSubmit" type="button" data-i18n="pair.connect">连接</button>
      <span id="pairStatus" class="hint"></span>
    </div>
  </div>
</div>

<div class="overlay" id="dialogOverlay">
  <div class="card">
    <h1 id="dialogTitle" style="font-size:18px;margin:0 0 8px"></h1>
    <p class="hint" id="dialogMessage" style="margin:0 0 12px"></p>
    <div id="dialogFields"></div>
    <div class="actions" style="margin-top:16px;justify-content:flex-end">
      <button class="ghost" id="dialogCancel" type="button" data-i18n="dialog.cancel">取消</button>
      <button id="dialogOk" type="button" data-i18n="dialog.ok">确定</button>
    </div>
  </div>
</div>

<div class="overlay" id="exportDialog">
  <div class="card" style="width:min(520px,100%)">
    <h1 id="exportTitle" style="font-size:18px;margin:0 0 8px"></h1>
    <input id="exportSearch" type="search" style="width:100%;box-sizing:border-box;margin-bottom:10px" />
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px">
      <input type="checkbox" id="exportSelectAll" /> <span id="exportSelectAllLabel"></span>
    </label>
    <div id="exportList" style="max-height:46vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-bottom:14px"></div>
    <div class="actions" style="justify-content:space-between">
      <span class="hint" id="exportCount"></span>
      <span style="display:flex;gap:8px">
        <button class="ghost" id="exportCancel" type="button" data-i18n="dialog.cancel">取消</button>
        <button id="exportOk" type="button" data-i18n="voice.exportSelected">导出所选</button>
      </span>
    </div>
  </div>
</div>

<div class="overlay" id="importDialog">
  <div class="card" style="width:min(460px,100%)">
    <h1 id="importTitle" style="font-size:18px;margin:0 0 8px"></h1>
    <p class="hint" id="importMessage" style="margin:0 0 14px"></p>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button id="importSkip" type="button" data-default="true"></button>
      <button class="ghost" id="importCopy" type="button"></button>
      <button class="ghost danger" id="importOverwrite" type="button"></button>
    </div>
    <div class="actions" style="margin-top:14px;justify-content:flex-end">
      <button class="ghost" id="importCancel" type="button" data-i18n="dialog.cancel">取消</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<template id="captureTpl">
  <div class="prompt-box">
    <input type="file" class="cap-file" accept="audio/wav,.wav" hidden />
    <button class="ghost cap-pick" type="button" data-i18n="cap.file">选择文件</button>
    <button class="rec cap-rec" type="button" data-i18n="cap.record">● 录音</button>
    <button class="ghost cap-transcribe" type="button" hidden data-i18n="cap.transcribe">✎ 转写</button>
    <span class="fileinfo cap-info" data-i18n="cap.none">未选择</span>
  </div>
</template>
