name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format, lint and build every crate on all three desktop platforms.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # tauri-build validates externalBin at compile time, so the sidecar
      # must exist for the host target before clippy/build run.
      - name: Stage sidecar
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p crates/laverock-desktop/binaries
          # A restored rust-cache can contain a partially extracted
          # sherpa-onnx lib dir; drop it so the build script re-extracts
          # from the cached archive (no re-download).
          rm -rf target/sherpa-onnx-prebuilt/*/lib target/sherpa-onnx-prebuilt/*/jniLibs || true
          cargo build -p laverock-server
          cp "target/debug/laverock${ext}" \
             "crates/laverock-desktop/binaries/laverock-${triple}${ext}"

      # Tauri prerequisites on Linux runners.
      - name: Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      # macOS still ships bash 3.2, which misparses `$var` when a
      # multibyte character follows; the install scripts are full of
      # Chinese progress lines, so lint for it on every platform.
      - name: Shell scripts
        run: ./scripts/check-shell.sh

      # The UI ships as one generated HTML file; make sure its sources in
      # crates/laverock-server/web/ were not edited without rebuilding it.
      - name: Web bundle
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/build-web.py --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --all-targets

  # Actually run the server and exercise it end to end with the small
  # ZipVoice model (~160 MB, cached).
  smoke:
    name: smoke (ubuntu)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Cache ZipVoice model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia
          key: zipvoice-int8-${{ hashFiles('scripts/download-zipvoice.sh') }}

      - name: Cache SenseVoice model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17-int8
          key: sensevoice-int8-${{ hashFiles('scripts/download-stt.sh') }}

      - name: Download models
        run: |
          ./scripts/download-zipvoice.sh
          ./scripts/download-stt.sh

      - name: Build server
        run: |
          # A restored rust-cache can hold a partially extracted
          # sherpa-onnx lib dir; force a re-extract from the cached
          # archive before building.
          rm -rf target/sherpa-onnx-prebuilt/*/lib target/sherpa-onnx-prebuilt/*/jniLibs || true
          cargo build -p laverock-server

      - name: Start server
        run: |
          ./target/debug/laverock > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      # The chain a user walks: the reference clip is transcribed and that
      # transcript feeds a clone synthesis, then history and export.
      - name: End-to-end test
        run: ./scripts/e2e-test.sh

      - name: Server log
        if: always()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
