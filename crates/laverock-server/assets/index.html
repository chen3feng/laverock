<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>Laverock</title>
<style>
  :root {
    --bg: #0e0f13; --panel: #171922; --panel2: #1e2130; --line: #2a2e3f;
    --text: #e8eaf2; --muted: #9aa0b5; --accent: #7cc4ff; --accent2: #5b8def;
    --danger: #ff6b6b; --ok: #5dd39e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: 0.5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  select, textarea, input[type="text"] {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    font: inherit; outline: none;
  }
  textarea { min-height: 110px; resize: vertical; }
  select:focus, textarea:focus { border-color: var(--accent2); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  button {
    background: var(--accent2); color: white; border: 0; border-radius: 10px;
    padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.ghost { background: var(--panel2); border: 1px solid var(--line); color: var(--text); }
  button.rec { background: #3a2030; border: 1px solid #6e3040; color: #ffb3c0; }
  button.rec.on { background: var(--danger); color: #fff; border-color: var(--danger); }
  .prompt-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .fileinfo { font-size: 12.5px; color: var(--muted); }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 4px; }
  #status { font-size: 13px; color: var(--muted); min-height: 20px; }
  #status.err { color: var(--danger); }
  #status.ok { color: var(--ok); }
  audio { width: 100%; margin-top: 14px; }
  .badge { display: inline-block; font-size: 11px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; margin-left: 8px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--muted); }
  .switch input { appearance: none; width: 42px; height: 24px; border-radius: 999px;
    background: #2a2e3f; position: relative; transition: background .2s; cursor: pointer; }
  .switch input:checked { background: var(--accent2); }
  .switch input::after { content: ''; position: absolute; top: 3px; left: 3px;
    width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch input:checked::after { left: 21px; }
  .qr { background: #fff; padding: 10px; border-radius: 10px; width: 240px; height: 240px;
    display: none; margin-top: 12px; }
  .qr svg { width: 100%; height: 100%; display: block; }
  .overlay { position: fixed; inset: 0; background: rgba(8, 9, 12, .94);
    display: none; place-items: center; z-index: 50; padding: 20px; }
  .overlay.show { display: grid; }
  .overlay .card { width: min(420px, 100%); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Laverock <span class="badge">MVP · ZipVoice zh/en</span></h1>
  <div class="sub">本地语音克隆合成 — 所有处理都在这台电脑上完成</div>

  <div class="card">
    <label for="engine">引擎</label>
    <select id="engine"></select>
  </div>

  <div class="card" id="remoteCard" style="display:none">
    <label>手机遥控</label>
    <div class="prompt-box" style="justify-content:space-between">
      <span class="hint" id="lanHint">开启后，同一 Wi-Fi 下的手机经配对即可访问同一套界面</span>
      <label class="switch">
        <input type="checkbox" id="lanToggle" />
        <span id="lanToggleLabel">局域网访问</span>
      </label>
    </div>
    <div id="lanPanel" style="display:none;margin-top:14px">
      <div class="prompt-box">
        <button class="ghost" id="pairBtn" type="button">生成配对二维码</button>
        <span class="fileinfo" id="pairInfo"></span>
      </div>
      <div class="qr" id="qr"></div>
      <div class="hint" id="pairHint"></div>
      <div style="margin-top:16px">
        <label>已配对设备</label>
        <div id="deviceList" class="hint">暂无</div>
      </div>
    </div>
  </div>

  <div class="card">
    <label for="profile">声音库（已保存的参考声音）</label>
    <div class="prompt-box">
      <select id="profile" style="flex:1">
        <option value="">— 临时录音 / 上传 —</option>
      </select>
      <button class="ghost" id="preview" type="button" disabled>试听</button>
      <button class="ghost" id="delprofile" type="button" disabled>删除</button>
    </div>
    <div class="hint" id="profilehint">选择一个已保存的声音，或使用下方的临时录音。</div>
  </div>

  <div class="card" id="adhoc">
    <label>参考声音（3–10 秒干净人声 WAV）</label>
    <div class="prompt-box">
      <input type="file" id="file" accept="audio/wav,.wav" style="display:none" />
      <button class="ghost" id="pick" type="button">选择文件</button>
      <button class="rec" id="rec" type="button">● 录音</button>
      <span class="fileinfo" id="promptinfo">未选择</span>
    </div>
    <div class="hint">录音会在浏览器内重采样为 24kHz 单声道 WAV；也可以上传 wav/mp3 转码后的 wav。</div>
    <div style="margin-top:14px">
      <label for="prompt_text">参考音频对应文字（ZipVoice 必填；VoxCPM2 可留空）</label>
      <input type="text" id="prompt_text" placeholder="例如：那还是三十六年前，一九八七年。" />
      <div class="hint">录音说了什么就填什么，中英文均可。ZipVoice 用它对齐音色与韵律；VoxCPM2 仅凭声音即可克隆。</div>
    </div>
    <div style="margin-top:14px">
      <label for="profilename">保存到声音库（可选，便于下次直接复用）</label>
      <div class="prompt-box">
        <input type="text" id="profilename" placeholder="给这个声音起个名字，例如：新闻女声" style="flex:1" />
        <button class="ghost" id="saveprofile" type="button">保存声音</button>
      </div>
      <div class="hint" id="savehint"></div>
    </div>
  </div>

  <div class="card">
    <label for="text">要合成的文字</label>
    <textarea id="text" placeholder="输入中文或 English 文本……"></textarea>
    <div class="row" style="margin-top:14px">
      <div>
        <label for="speed">语速 <span id="speedv">1.0</span></label>
        <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" style="width:100%" />
      </div>
      <div>
        <label for="steps">扩散步数 <span id="stepsv">4</span>（越多越稳、越慢）</label>
        <input type="range" id="steps" min="1" max="16" step="1" value="4" style="width:100%" />
      </div>
    </div>
  </div>

  <div class="actions">
    <button id="go" type="button">生成语音</button>
    <span id="status"></span>
  </div>
  <audio id="player" controls style="display:none"></audio>
  <audio id="previewer" style="display:none"></audio>
</div>

<div class="overlay" id="pairOverlay">
  <div class="card">
    <h1 style="font-size:18px;margin:0 0 8px">连接到 Laverock</h1>
    <p class="hint" id="pairMsg">在这台电脑上打开「手机遥控 → 生成配对二维码」，然后用手机扫码。</p>
    <div style="margin-top:14px">
      <label for="pairCode">配对码</label>
      <input type="text" id="pairCode" inputmode="numeric" autocomplete="one-time-code"
             placeholder="6 位数字" />
    </div>
    <div class="actions" style="margin-top:14px">
      <button id="pairSubmit" type="button">连接</button>
      <span id="pairStatus" class="hint"></span>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let promptBlob = null, promptName = null, mediaRecorder_state = null;
let profiles = [];

function selectedProfile() {
  return profiles.find(p => p.id === $('profile').value) || null;
}

function syncProfileUI() {
  const p = selectedProfile();
  $('adhoc').style.display = p ? 'none' : 'block';
  $('preview').disabled = !p;
  $('delprofile').disabled = !p;
  $('profilehint').textContent = p
    ? `使用「${p.name}」· 参考文本：${p.prompt_text}`
    : '选择一个已保存的声音，或使用下方的临时录音。';
}

async function loadProfiles() {
  const res = await fetch('/api/profiles');
  profiles = await res.json();
  const sel = $('profile');
  const current = sel.value;
  sel.innerHTML = '<option value="">— 临时录音 / 上传 —</option>';
  for (const p of profiles) {
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name;
    sel.appendChild(o);
  }
  if (profiles.some(p => p.id === current)) sel.value = current;
  syncProfileUI();
}

$('profile').onchange = syncProfileUI;

$('preview').onclick = () => {
  const p = selectedProfile();
  if (!p) return;
  $('previewer').src = `/api/profiles/${p.id}/audio`;
  $('previewer').play();
};

$('delprofile').onclick = async () => {
  const p = selectedProfile();
  if (!p) return;
  if (!confirm(`删除声音「${p.name}」？此操作不可撤销。`)) return;
  const res = await fetch(`/api/profiles/${p.id}`, { method: 'DELETE' });
  if (res.ok) {
    $('profilehint').textContent = `已删除「${p.name}」`;
    await loadProfiles();
  } else {
    $('profilehint').textContent = '删除失败';
  }
};

$('saveprofile').onclick = async () => {
  const name = $('profilename').value.trim();
  const ptext = $('prompt_text').value.trim();
  if (!promptBlob) { $('savehint').textContent = '请先选择或录制参考声音'; return; }
  if (!name) { $('savehint').textContent = '请给声音起个名字'; return; }
  if (!ptext) { $('savehint').textContent = '请填写参考音频对应的文字'; return; }

  const fd = new FormData();
  fd.append('name', name);
  fd.append('prompt_text', ptext);
  fd.append('prompt', promptBlob, promptName || 'reference.wav');
  const engine = $('engine').value;
  if (engine) fd.append('engine_id', engine);

  const res = await fetch('/api/profiles', { method: 'POST', body: fd });
  if (!res.ok) {
    const msg = await res.json().then(j => j.error).catch(() => res.statusText);
    $('savehint').textContent = '保存失败：' + msg;
    return;
  }
  const meta = await res.json();
  $('profilename').value = '';
  $('savehint').textContent = `已保存「${meta.name}」，下次可直接选用`;
  await loadProfiles();
  $('profile').value = meta.id;
  syncProfileUI();
};

async function loadEngines() {
  const res = await fetch('/api/engines');
  const engines = await res.json();
  const sel = $('engine');
  sel.innerHTML = '';
  if (!engines.length) {
    sel.innerHTML = '<option>未发现模型 — 运行 scripts/download-model.sh</option>';
    $('go').disabled = true;
    return;
  }
  for (const e of engines) {
    const o = document.createElement('option');
    o.value = e.id;
    o.textContent = `${e.name} (${e.languages.join('/') || '?'})`;
    sel.appendChild(o);
  }
  $('steps').value = engines[0].defaults?.num_steps ?? 4;
  $('stepsv').textContent = $('steps').value;
}

$('speed').oninput = (e) => $('speedv').textContent = e.target.value;
$('steps').oninput = (e) => $('stepsv').textContent = e.target.value;

$('pick').onclick = () => $('file').click();
$('file').onchange = () => {
  const f = $('file').files[0];
  if (!f) return;
  promptBlob = f; promptName = f.name;
  $('promptinfo').textContent = `${f.name} · ${(f.size/1024/1024).toFixed(2)} MB`;
};

// ---- Mic -> 24kHz mono WAV (no MediaRecorder/webm dependency) ----
$('rec').onclick = async () => {
  const btn = $('rec');
  if (mediaRecorder_state) {
    mediaRecorder_state.stop();
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    $('promptinfo').textContent = '当前环境不支持麦克风录音，请改用「选择文件」上传 WAV';
    return;
  }

  $('promptinfo').textContent = '正在请求麦克风权限……';
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
    });
  } catch (e) {
    const name = e && e.name ? e.name : 'Error';
    const hint = name === 'NotAllowedError'
      ? '权限被拒绝。请在「系统设置 → 隐私与安全性 → 麦克风」中允许 Laverock（或你使用的浏览器），然后重试。'
      : name === 'NotFoundError'
        ? '没有找到可用的麦克风设备。'
        : '请检查系统麦克风设置后重试。';
    $('promptinfo').textContent = `无法录音（${name}）：${hint}`;
    return;
  }

  const ctx = new AudioContext();
  await ctx.resume();
  const src = ctx.createMediaStreamSource(stream);
  const TARGET = 24000;
  const ratio = ctx.sampleRate / TARGET;
  const chunks = [];
  const node = ctx.createScriptProcessor(4096, 1, 1);
  node.onaudioprocess = (e) => chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  src.connect(node); node.connect(ctx.destination);
  btn.classList.add('on'); btn.textContent = '■ 停止';
  $('promptinfo').textContent = '录音中……再次点击结束';

  mediaRecorder_state = {
    stop() {
      node.disconnect(); src.disconnect(); stream.getTracks().forEach(t => t.stop());
      ctx.close();
      const raw = concatFloat(chunks);
      const down = downsample(raw, ratio);
      promptBlob = new Blob([encodeWav(down, TARGET)], { type: 'audio/wav' });
      promptName = 'mic-reference.wav';
      const sec = (down.length / TARGET).toFixed(1);
      $('promptinfo').textContent = `麦克风录音 · ${sec}s`;
      btn.classList.remove('on'); btn.textContent = '● 录音';
      mediaRecorder_state = null;
    }
  };
};

function concatFloat(arrs) {
  const n = arrs.reduce((a, b) => a + b.length, 0);
  const out = new Float32Array(n);
  let o = 0;
  for (const a of arrs) { out.set(a, o); o += a.length; }
  return out;
}
function downsample(input, ratio) {
  const outLen = Math.floor(input.length / ratio);
  const out = new Float32Array(outLen);
  for (let i = 0; i < outLen; i++) {
    const start = Math.floor(i * ratio), end = Math.floor((i + 1) * ratio);
    let sum = 0;
    for (let j = start; j < end && j < input.length; j++) sum += input[j];
    out[i] = sum / Math.max(1, end - start);
  }
  return out;
}
function encodeWav(samples, sr) {
  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const wstr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wstr(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); wstr(8, 'WAVE');
  wstr(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  wstr(36, 'data'); v.setUint32(40, samples.length * 2, true);
  let o = 44;
  for (const s of samples) {
    v.setInt16(o, Math.max(-1, Math.min(1, s)) * 0x7fff, true); o += 2;
  }
  return buf;
}

$('go').onclick = async () => {
  const status = $('status');
  const saved = selectedProfile();
  if (!saved && !promptBlob) {
    status.className = 'err'; status.textContent = '请选择一个已保存的声音，或录制/上传参考声音'; return;
  }
  const text = $('text').value.trim();
  if (!text) { status.className = 'err'; status.textContent = '请输入要合成的文字'; return; }

  const fd = new FormData();
  fd.append('text', text);
  if (saved) {
    fd.append('profile_id', saved.id);
  } else {
    fd.append('prompt', promptBlob, promptName);
    const pt = $('prompt_text').value.trim();
    if (pt) fd.append('prompt_text', pt);
  }
  fd.append('speed', $('speed').value);
  fd.append('num_steps', $('steps').value);

  $('go').disabled = true;
  status.className = ''; status.textContent = '合成中（首次加载模型需要几秒）……';
  const t0 = performance.now();
  try {
    const res = await fetch(`/api/engines/${$('engine').value}/synthesize`, { method: 'POST', body: fd });
    if (!res.ok) {
      const msg = await res.json().then(j => j.error).catch(() => res.statusText);
      throw new Error(msg);
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const p = $('player');
    p.src = url; p.style.display = 'block'; p.play();
    status.className = 'ok';
    status.textContent = `完成 · ${(blob.size/1024).toFixed(0)} KB · ${((performance.now()-t0)/1000).toFixed(1)}s`;
  } catch (e) {
    status.className = 'err'; status.textContent = '失败：' + e.message;
  } finally {
    $('go').disabled = false;
  }
};

// ---------------- remote / pairing ----------------

let session = { loopback: true, paired: false };

async function loadSession() {
  try {
    session = await fetch('/api/session').then(r => r.json());
  } catch {
    session = { loopback: true, paired: false };
  }
  const desktop = session.loopback;
  $('remoteCard').style.display = desktop ? 'block' : 'none';

  if (!desktop && !session.paired) {
    // A QR link carries ?pair=CODE: claim it and reload without the query.
    const code = new URLSearchParams(location.search).get('pair');
    if (code) {
      $('pairCode').value = code;
      $('pairMsg').textContent = '正在配对……';
      const ok = await claim(code);
      if (ok) return;
    }
    $('pairOverlay').classList.add('show');
    return;
  }
  $('pairOverlay').classList.remove('show');

  if (desktop) {
    $('lanToggle').checked = !!session.lan_enabled;
    $('lanPanel').style.display = session.lan_enabled ? 'block' : 'none';
    if (session.lan_enabled) {
      $('lanHint').textContent = `同一 Wi-Fi 下的手机可访问 ${session.lan_url || ''}`;
      await loadDevices();
    }
  } else {
    // Phone: surface which device this is, and note the mic limitation.
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = `已连接到电脑${session.device_name ? '（' + session.device_name + '）' : ''}`;
    document.querySelector('.sub').after(hint);
  }

  if (!window.isSecureContext && $('rec')) {
    $('rec').disabled = true;
    $('rec').title = '需要通过 HTTPS 访问才能使用手机麦克风';
  }
}

async function claim(code) {
  const status = $('pairStatus');
  status.textContent = '';
  try {
    const res = await fetch('/api/pair/claim', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code, device_name: deviceName() }),
    });
    if (!res.ok) {
      const msg = await res.json().then(j => j.error).catch(() => res.statusText);
      throw new Error(msg);
    }
    location.replace('/');
    return true;
  } catch (e) {
    $('pairMsg').textContent = '配对失败：' + e.message;
    $('pairOverlay').classList.add('show');
    return false;
  }
}

function deviceName() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua)) return 'iPhone';
  if (/iPad/.test(ua)) return 'iPad';
  if (/Android/.test(ua)) return 'Android 手机';
  if (/Macintosh/.test(ua)) return 'Mac 浏览器';
  return '浏览器设备';
}

$('pairSubmit').onclick = () => {
  const code = $('pairCode').value.trim();
  if (!/^\d{6}$/.test(code)) {
    $('pairMsg').textContent = '请输入 6 位配对码';
    return;
  }
  claim(code);
};

$('pairCode').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('pairSubmit').click();
});

$('lanToggle').onchange = async () => {
  const enabled = $('lanToggle').checked;
  $('lanHint').textContent = enabled ? '正在开启……' : '正在关闭……';
  const res = await fetch('/api/settings/lan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ enabled }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    $('lanToggle').checked = !enabled;
    $('lanHint').textContent = '操作失败：' + (body.error || res.statusText);
    return;
  }
  $('lanPanel').style.display = enabled ? 'block' : 'none';
  $('qr').style.display = 'none';
  $('pairInfo').textContent = '';
  $('lanHint').textContent = enabled
    ? `${body.url || ''}${body.fingerprint ? '  ·  证书指纹 ' + body.fingerprint.slice(0, 17) + '…' : ''}`
    : '开启后，同一 Wi-Fi 下的手机经配对即可访问同一套界面';
  if (!enabled) $('deviceList').textContent = '暂无';
  else loadDevices();
};

$('pairBtn').onclick = async () => {
  $('pairInfo').textContent = '生成中……';
  const res = await fetch('/api/pair/start', { method: 'POST' });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    $('pairInfo').textContent = '失败：' + (body.error || res.statusText);
    return;
  }
  $('qr').innerHTML = body.qr_svg;
  $('qr').style.display = 'block';
  $('pairInfo').textContent = `配对码 ${body.code}`;
  $('pairHint').textContent = '手机扫码即可打开 https 链接；首次访问会提示证书不受信任，请选择「高级 → 继续前往」以允许使用麦克风（证书指纹 ' +
    (body.fingerprint ? body.fingerprint.slice(0, 17) + '…' : '') + '）。5 分钟内有效。';
};

async function loadDevices() {
  const list = await fetch('/api/devices').then(r => r.json()).catch(() => []);
  const box = $('deviceList');
  if (!list.length) { box.textContent = '暂无'; return; }
  box.innerHTML = '';
  for (const d of list) {
    const row = document.createElement('div');
    row.className = 'prompt-box';
    row.style.marginTop = '8px';
    const name = document.createElement('span');
    name.textContent = `${d.name} · ${new Date(d.created_at * 1000).toLocaleDateString()}`;
    const btn = document.createElement('button');
    btn.className = 'ghost';
    btn.type = 'button';
    btn.textContent = '撤销';
    btn.onclick = async () => {
      if (!confirm(`撤销设备「${d.name}」的访问权限？`)) return;
      const res = await fetch(`/api/devices/${d.id}`, { method: 'DELETE' });
      if (res.ok) loadDevices();
    };
    row.append(name, btn);
    box.appendChild(row);
  }
}
