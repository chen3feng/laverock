[package]
name = "laverock-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local HTTP control server for Laverock"

[[bin]]
name = "laverock"
path = "src/main.rs"

[dependencies]
laverock-core = { path = "../laverock-core", default-features = false }
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "net"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
sha2 = "0.10"
getrandom = "0.3"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.14"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
base64 = "0.22"
# Pure-Rust MPEG-1/2/2.5 Layer III encoder (Apache-2.0, zero dependencies):
# MP3 export works out of the box, with no system ffmpeg/lame install.
rusty_mp3 = "1.0.5"
tokio-stream = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
hound = "3.5"

[features]
default = ["onnx-cpu"]
onnx-cpu = ["laverock-core/onnx-cpu"]
# CUDA-enabled ONNX runtime; see laverock-core's features for the build setup.
onnx-cuda = ["laverock-core/onnx-cuda"]
