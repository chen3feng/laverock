[workspace]
resolver = "2"
members = [
    "crates/laverock-core",
    "crates/laverock-server",
    "crates/laverock-desktop",
]

[workspace.package]
version = "0.2.0-alpha"
edition = "2021"
license = "MIT"
repository = "https://github.com/chen3feng/laverock"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "thin"
