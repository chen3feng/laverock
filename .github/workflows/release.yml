name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            triple: aarch64-apple-darwin
            bundles: dmg
            ext: ""
          - name: windows-x64
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            ext: ".exe"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.triple }}

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # The server is shipped as a Tauri sidecar, so it must be built for the
      # same target and placed where the bundler expects it.
      - name: Build server
        run: cargo build --release -p laverock-server --target ${{ matrix.triple }}

      - name: Stage sidecar
        shell: bash
        run: |
          mkdir -p crates/laverock-desktop/binaries
          cp "target/${{ matrix.triple }}/release/laverock${{ matrix.ext }}" \
             "crates/laverock-desktop/binaries/laverock-${{ matrix.triple }}${{ matrix.ext }}"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Build bundle
        working-directory: crates/laverock-desktop
        run: npx -y @tauri-apps/cli@2.12.4 build --target ${{ matrix.triple }} --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laverock-${{ matrix.name }}
          if-no-files-found: error
          path: |
            target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            target/${{ matrix.triple }}/release/bundle/nsis/*.exe

  release:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Laverock ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: artifacts/**/*
          body: |
            **Laverock ${{ github.ref_name }}** — 本地优先的 AI 语音工作室（alpha）。

            ### 安装

            | 平台 | 文件 |
            |---|---|
            | macOS (Apple Silicon) | `Laverock_*_aarch64.dmg` |
            | Windows 64-bit | `Laverock_*_x64-setup.exe` |

            - macOS 应用未做公证，首次打开请右键 → 打开；麦克风权限在首次录音时询问。
            - Windows 安装包未签名，SmartScreen 可能提示，选择"更多信息 → 仍要运行"。

            ### 首次使用需要下载模型

            应用本身不含模型权重。安装后在终端运行：

            ```bash
            ./scripts/download-model.sh     # ZipVoice，~160 MB，中英
            ./scripts/download-voxcpm2.sh   # VoxCPM2，~3.3 GB，30 语言（需要 git/cmake/C++）
            ```

            macOS 默认读取 `~/Library/Application Support/sh.laverock.desktop/models`；
            Windows 默认读取 `%APPDATA%\sh.laverock.desktop\models`。
            也可以设置 `LAVEROCK_MODELS_DIR` 指向模型目录后启动应用。

            ### 功能

            - 两个引擎：ZipVoice（ONNX，中英，需参考文本）与 VoxCPM2（GGUF，30 语言，仅需参考音频）
            - 声音库：参考音频与转录本地保存，一次录音重复使用
            - 手机遥控：局域网 HTTPS + 二维码配对 + 设备令牌，可随时撤销
            - 完全本地，无遥测
