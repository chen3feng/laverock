name: VoxCPM2 runner

# Build voxcpm2-cli from tc-mb/llama.cpp-omni once per platform and publish
# the binaries on a rolling "voxcpm2-runner" GitHub release. scripts/download-
# voxcpm2.sh fetches these instead of compiling on the user's machine; the
# local cmake build remains as a fallback for unreleased platforms.
#
# No code in this repo links against llama.cpp — only the CLI binary is
# redistributed (MIT, LICENSE travels inside every archive).

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "tc-mb/llama.cpp-omni ref (branch/tag/full SHA) to build"
        required: true
        # Tested SHA; the portability patch is generated against this commit.
        # Bump both together when moving the runner forward.
        default: "a64932ec615e1463158129feaf2f0752d0c07a2e"
      reason:
        description: "Why this rebuild (recorded in the release notes)"
        required: false

permissions:
  contents: write

concurrency:
  group: voxcpm2-runner
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            exe: ""
            archive: tar.gz
            # Embed the Metal kernel library so the archive stays one file.
            args: >-
              -DGGML_METAL=ON
              -DGGML_METAL_EMBED_LIBRARY=ON
              -DGGML_NATIVE=OFF
              -DLLAMA_CURL=OFF
              -DBUILD_SHARED_LIBS=OFF
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - name: macos-x64
            os: macos-15-intel
            exe: ""
            archive: tar.gz
            # Matches the upstream fork's own release matrix: Metal is off on
            # Intel CI runners (intermittent failures without a GPU there).
            args: >-
              -DGGML_METAL=OFF
              -DGGML_NATIVE=OFF
              -DLLAMA_CURL=OFF
              -DBUILD_SHARED_LIBS=OFF
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
          - name: linux-x64
            os: ubuntu-22.04
            exe: ""
            archive: tar.gz
            # Build on 22.04 for the older glibc. Static, NATIVE off: one
            # x86-64 baseline (SSE2) binary that runs on every CPU. OpenMP
            # off so the binary needs no libgomp.so.1 — same choice the
            # audio.cpp cpu-portable runtime makes.
            args: >-
              -DGGML_NATIVE=OFF
              -DLLAMA_CURL=OFF
              -DGGML_OPENMP=OFF
              -DBUILD_SHARED_LIBS=OFF
          - name: windows-x64
            os: windows-latest
            exe: ".exe"
            archive: zip
            # Static baseline x86-64; GGML_STATIC links the MSVC runtime in
            # so no VC redist is needed on the user's machine.
            args: >-
              -DGGML_NATIVE=OFF
              -DLLAMA_CURL=OFF
              -DGGML_STATIC=ON
              -DGGML_OPENMP=OFF
              -DBUILD_SHARED_LIBS=OFF

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git

      - name: Checkout tc-mb/llama.cpp-omni
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ inputs.upstream_ref }}"
          git clone --depth 1 https://github.com/tc-mb/llama.cpp-omni.git upstream
          if [ "$ref" != "master" ]; then
            git -C upstream fetch --depth 1 origin "$ref"
            git -C upstream checkout FETCH_HEAD
          fi
          git -C upstream rev-parse HEAD > upstream-commit.txt
          echo "building $(cat upstream-commit.txt) ($ref)"

      - name: Apply portability patches
        shell: bash
        run: |
          set -euo pipefail
          # The fork's MoE slot code is Apple-only upstream: F_NOCACHE does
          # not exist on Linux, and on Windows struct iovec is only
          # forward-declared. The patch keeps macOS behaviour identical.
          # Fail loudly if it stops applying — upstream moved; regenerate it.
          # Absolute path: -C only changes the repository directory, not how
          # the patch pathname argument is resolved.
          git -C upstream apply "${GITHUB_WORKSPACE}/scripts/patches/0001-moe-slot-portability.patch"

      - name: Configure
        shell: bash
        run: cmake -S upstream -B build ${{ matrix.args }}

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          nproc=4
          command -v nproc >/dev/null && nproc=$(nproc)
          [ -n "${NUMBER_OF_PROCESSORS:-}" ] && nproc="$NUMBER_OF_PROCESSORS"
          # Only the runner: the fork's omni server/cli targets do not build
          # on Linux/Windows (Apple-only MoE slot code) and are not needed.
          # Static build = a single binary, no companion libraries.
          cmake --build build --config Release --target voxcpm2-cli -j "$nproc"

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          bin="$(find build -name 'voxcpm2-cli${{ matrix.exe }}' -type f | head -1)"
          [ -n "$bin" ] || { echo "voxcpm2-cli not found under build/"; exit 1; }
          mkdir -p stage
          cp "$bin" "stage/voxcpm2-cli${{ matrix.exe }}"
          cp upstream/LICENSE stage/LICENSE
          cp upstream-commit.txt stage/COMMIT
          # Static builds: one self-contained binary per platform, no
          # companion shared libraries.
          echo "stage contents:"; ls -la stage

      - name: Linkage audit
        shell: bash
        run: |
          set -euo pipefail
          # The artifact must not depend on anything beyond what ships with
          # the OS (a previous build silently linked Homebrew OpenSSL and
          # still passed the smoke test on the runner).
          case "${{ matrix.name }}" in
            macos*)
              otool -L stage/voxcpm2-cli
              if otool -L stage/voxcpm2-cli | grep -Eq '/opt/homebrew|/usr/local|@rpath'; then
                echo "::error::non-system shared-library dependency"; exit 1
              fi ;;
            linux-x64)
              ldd stage/voxcpm2-cli
              if ldd stage/voxcpm2-cli | grep -q 'not found'; then
                echo "::error::unresolved shared-library dependency"; exit 1
              fi
              ldd stage/voxcpm2-cli
              ldd stage/voxcpm2-cli | awk '{print $1}' \
                | grep -Ev '^(linux-vdso[^ ]*|ld-linux[^ ]*|lib(c|m|dl|rt|pthread)\.so[^ ]*|libstdc\+\+\.so[^ ]*|libgcc_s\.so[^ ]*)$' \
                | grep . && { echo "::error::unexpected shared-library dependency"; exit 1; } || true ;;
            windows-x64)
              # vcomp140.dll would mean OpenMP crept back in; the UCRT set is
              # expected with GGML_STATIC linking the MSVC runtime.
              (dumpbin //dependents stage/voxcpm2-cli.exe 2>/dev/null || true) | tee deps.txt
              ! grep -qi 'vcomp.*\.dll' deps.txt ;;
          esac

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          # --help exits non-zero by design upstream; assert on the usage
          # banner instead, same as the fork's own ctest.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            ./stage/voxcpm2-cli.exe --help > help.txt 2>&1 || true
          else
            (cd stage && ./voxcpm2-cli --help) > help.txt 2>&1 || true
          fi
          cat help.txt
          grep -qi voxcpm2 help.txt

      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.archive }}" = "tar.gz" ]; then
            tar -C stage -czf "voxcpm2-cli-${{ matrix.name }}.tar.gz" .
          else
            powershell -NoProfile -Command \
              "Compress-Archive -Path (Resolve-Path stage/*) -DestinationPath voxcpm2-cli-${{ matrix.name }}.zip -Force"
          fi
          ls -la voxcpm2-cli-${{ matrix.name }}.*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: voxcpm2-cli-${{ matrix.name }}
          path: voxcpm2-cli-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: publish rolling release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true

      - name: Write checksum manifest
        run: |
          set -euo pipefail
          # One fixed-width line per file so the shell script can parse the
          # manifest with sed (no jq/python on a bare user machine).
          commit="$(tar -xzOf assets/voxcpm2-cli-linux-x64.tar.gz ./COMMIT | tr -d '[:space:]')"
          entries=""
          for f in $(ls assets/voxcpm2-cli-* | sort); do
            name="$(basename "$f")"
            sha="$(sha256sum "$f" | cut -d' ' -f1)"
            size="$(stat -c%s "$f")"
            entries+="    \"$name\": {\"sha256\": \"$sha\", \"size\": $size},"$'\n'
          done
          # Strip the trailing comma so the manifest is valid JSON while
          # keeping one fixed-width line per file for the script's sed.
          entries="${entries%$'\n'}"; entries="${entries%,}"
          {
            echo '{'
            echo "  \"upstream\": \"$commit\","
            echo '  "files": {'
            printf '%s\n' "$entries"
            echo '  }'
            echo '}'
          } > assets/voxcpm2-runner.json
          python3 -m json.tool assets/voxcpm2-runner.json

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: voxcpm2-runner
          name: VoxCPM2 runner (prebuilt voxcpm2-cli)
          prerelease: true
          make_latest: 'false'
          files: assets/*
          body: |
            Prebuilt [`voxcpm2-cli`](https://github.com/tc-mb/llama.cpp-omni)
            binaries used by `scripts/download-voxcpm2.sh`. Not an end-user
            download — install VoxCPM2 from the in-app model catalog instead.

            - Source: `tc-mb/llama.cpp-omni` @ `${{ inputs.upstream_ref }}`
            - Upstream commit recorded in each archive's `COMMIT` and in
              `voxcpm2-runner.json`
            - Reason: ${{ inputs.reason }}
