    <!-- ================= 转写 ================= -->
    <section id="page-transcribe" class="page">
      <div class="page-head">
        <div><h1 data-i18n="transcribe.title">转写</h1><p class="sub" data-i18n="transcribe.sub">把一段录音或音频转成文字，带时间轴，可复制或导出 TXT / SRT / VTT。</p></div>
      </div>
      <div class="card">
        <label data-i18n="transcribe.audio">音频</label>
        <div id="transcribeCapture"></div>
        <p class="hint" id="transcribeHint" data-i18n="transcribe.hint">转写在本机完成；首次使用需要先到「模型」页安装 SenseVoice。</p>
      </div>
      <div class="card" id="transcribeResultCard" hidden>
        <div class="hist-meta" id="transcribeResultMeta"></div>
        <textarea id="transcribeText" class="hist-transcript" rows="8" spellcheck="false"></textarea>
        <div class="hist-row" id="transcribeActions"></div>
      </div>
      <div class="section-title" id="transcribeRecentTitle" data-i18n="transcribe.recent" hidden>最近转写</div>
      <div id="transcribeRecent"></div>
    </section>
