name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format, lint and build every crate on all three desktop platforms.
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      # tauri-build validates externalBin at compile time, so the sidecar
      # must exist for the host target before clippy/build run.
      - name: Stage sidecar
        shell: bash
        run: |
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=""
          [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          mkdir -p crates/laverock-desktop/binaries
          cargo build -p laverock-server
          cp "target/debug/laverock${ext}" \
             "crates/laverock-desktop/binaries/laverock-${triple}${ext}"

      # Tauri prerequisites on Linux runners.
      - name: Linux webview deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --all-targets

  # Actually run the server and exercise it end to end with the small
  # ZipVoice model (~160 MB, cached).
  smoke:
    name: smoke (ubuntu)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Cache ZipVoice model
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: models/sherpa-onnx-zipvoice-distill-int8-zh-en-emilia
          key: zipvoice-int8-${{ hashFiles('scripts/download-model.sh') }}

      - name: Download model
        run: ./scripts/download-model.sh

      - name: Build server
        run: cargo build -p laverock-server

      - name: Start server
        run: |
          ./target/debug/laverock > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Server log
        if: always()
        run: cat server.log

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
