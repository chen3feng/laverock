    <!-- ================= 设置 ================= -->
    <section id="page-settings" class="page">
      <div class="page-head"><h1 data-i18n="settings.title">设置</h1><p class="sub" data-i18n="settings.sub">下载网络、手机遥控与关于信息。</p></div>

      <div class="card">
        <label for="settingsLang" data-i18n="language">界面语言</label>
        <select id="settingsLang">
          <option value="system" data-i18n="lang.system">跟随系统</option>
          <option value="zh" data-i18n="lang.zh">中文</option>
          <option value="en" data-i18n="lang.en">English</option>
        </select>
        <div class="hint" data-i18n="language.hint">跟随系统时按浏览器语言自动选择；选择会保存在本设备。</div>
      </div>

      <div class="card" id="downloadSettings" hidden>
        <label data-i18n="settings.downloads">下载网络</label>
        <div class="hint" style="margin:0 0 14px" data-i18n="settings.downloads.hint">代理与镜像只影响模型下载脚本，不会改变本机推理。</div>
        <label for="proxyMode" data-i18n="proxy">代理</label>
        <select id="proxyMode">
          <option value="system" data-i18n="proxy.system">跟随系统代理（默认）</option>
          <option value="manual" data-i18n="proxy.manual">手动指定</option>
          <option value="direct" data-i18n="proxy.direct">不使用代理（直连）</option>
        </select>
        <input type="text" id="proxy" placeholder="http://127.0.0.1:10808" hidden style="margin-top:8px" />
        <div class="hint" id="proxyHint"></div>
        <div class="row" style="margin-top:14px">
          <div>
            <label for="hfPreset" data-i18n="hf.mirror">Hugging Face 镜像</label>
            <select id="hfPreset"></select>
            <input type="text" id="hfCustom" placeholder="https://…" hidden style="margin-top:8px" />
          </div>
          <div>
            <label for="pipPreset" data-i18n="pip.mirror">PyPI 镜像（Qwen3-TTS 安装）</label>
            <select id="pipPreset"></select>
            <input type="text" id="pipCustom" placeholder="https://…/simple" hidden style="margin-top:8px" />
          </div>
        </div>
        <label for="workspaceDir" data-i18n="settings.workspace">工作区目录（可选）</label>
        <input type="text" id="workspaceDir" placeholder="~/Library/Application Support/sh.laverock.desktop" />
        <div class="hint" data-i18n="settings.workspace.hint">留空使用默认位置。设置后模型下载到「目录/models」、虚拟环境装到「目录/tools」，方便把大文件放到更大的磁盘；重启后生效。</div>
        <div class="hint"><span data-i18n="settings.modelsdir">当前模型目录：</span><code id="pathModels">…</code> · <span data-i18n="settings.toolsdir">虚拟环境目录：</span><code id="pathTools">…</code> · <span data-i18n="settings.scriptsdir">脚本目录：</span><code id="pathScripts">…</code></div>
        <div class="actions" style="margin-top:14px">
          <button id="saveSettings" type="button" data-i18n="settings.save">保存设置</button>
          <span class="hint" id="settingsHint"></span>
        </div>
      </div>

      <div class="card" id="remoteCard" hidden>
        <label data-i18n="settings.remote">手机遥控</label>
        <div class="prompt-box" style="justify-content:space-between">
          <span class="hint" id="lanHint" data-i18n="lan.hint.default">开启后，同一 Wi-Fi 下的手机经配对即可访问同一套界面</span>
          <label class="switch">
            <input type="checkbox" id="lanToggle" />
            <span id="lanToggleLabel" data-i18n="lan.access">局域网访问</span>
          </label>
        </div>
        <div id="lanPanel" hidden style="margin-top:14px">
          <div class="prompt-box">
            <button class="ghost" id="pairBtn" type="button" data-i18n="pair.qr">生成配对二维码</button>
            <span class="fileinfo" id="pairInfo"></span>
          </div>
          <div class="qr" id="qr" hidden></div>
          <div class="hint" id="pairHint"></div>
          <div style="margin-top:16px">
            <label data-i18n="pair.devices">已配对设备</label>
            <div id="deviceList" class="hint" data-i18n="devices.none">暂无</div>
          </div>
        </div>
      </div>

      <div class="card" id="phoneSettings" hidden>
        <label data-i18n="phone.thisdevice">本机连接</label>
        <div class="hint" id="phoneInfo" data-i18n="phone.connected">已连接到电脑。</div>
        <div class="hint" data-i18n="phone.hint">网络、模型与下载设置只能在电脑上修改。</div>
        <div class="actions" style="margin-top:12px">
          <button class="ghost" id="unpair" type="button" data-i18n="phone.unpair">取消配对</button>
        </div>
      </div>

      <div class="card">
        <label data-i18n="about">关于</label>
        <div class="hint">Laverock <span id="aboutVersion">…</span> · MIT · <span data-i18n="about.suffix">所有推理都在本机完成。</span></div>
      </div>
    </section>
